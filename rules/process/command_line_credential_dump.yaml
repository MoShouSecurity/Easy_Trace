# Easy_Trace Analyzer 规则：LSASS 转储行为（命令行内容，high）
#
# 数据源：process.command_line（仅 Deep 且采集策略命中时才有；Basic 没有该字段）。
# 两组 AND：A=转储入口/工具，B=目标对象；避免只出现 lsass（排障）或只出现工具名时误报。
- rule_id: process.command_line.credential_dump_behavior
  title: 命令行出现 LSASS 转储行为
  description: 进程命令行同时包含转储入口/工具与 LSASS 等目标关键词。
  severity: high
  target:
    entity_type: process
  conditions:
    - field: command_line
      operator: contains_any
      values:
        - "procdump"
        - "comsvcs.dll"
        - "rundll32"
        - "taskmgr"
        - "nanodump"
        - "dumpert"
        - "sharpdump"
    - field: command_line
      operator: contains_any
      values:
        - "lsass"
        - "lsass.dmp"
        - "minidump"
    - field: collection_level
      operator: equals
      value: deep
  advice: 立即核对执行账号、父进程与文件哈希；LSASS 转储意味着凭据可能已泄露，需按事件流程处置。
