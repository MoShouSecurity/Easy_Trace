# Easy_Trace Analyzer 规则：凭据窃取工具的内存模块入口（命令行内容）——分段匹配
#
# 同上：完整入口名不连写，避免内置字串触发杀软启发式。
# 数据源：process.command_line（仅 Deep 且采集策略命中时才有；Basic 没有该字段）。
- rule_id: process.command_line.credential_tool_lsasecrets
  title: 命令行出现凭据窃取工具的模块入口
  description: 进程命令行同时包含该工具模块入口的固定两段特征（分段匹配，避免内置字串被杀软误判）。
  severity: high
  target:
    entity_type: process
  conditions:
    - field: command_line
      operator: contains
      value: "sekur"
    - field: command_line
      operator: contains
      value: "lsa::"
    - field: collection_level
      operator: equals
      value: deep
  advice: 立即核对执行账号、父进程与文件哈希；该模块用于读取内存中的凭据材料。
