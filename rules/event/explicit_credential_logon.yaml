# Easy_Trace Analyzer 规则：显式凭据登录（4648）
- rule_id: event.explicit_credential_logon
  title: 使用显式凭据登录
  description: 安全日志记录了一次显式凭据登录；runas、管理脚本和横向移动工具都可能使用，需核对发起账号与目标账号。
  severity: medium
  target:
    entity_type: event
  conditions:
    - field: event_id
      operator: equals
      value: "4648"
  advice: 核对 subject_user、target_user 与 ip_address；检查同一时段是否出现远程登录、服务安装或进程创建。
